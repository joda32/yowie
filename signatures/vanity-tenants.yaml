# Yowie signature pack — schema v1
#
# Edit freely: signatures are data, not code. Run `yowie validate`
# after changes to check the pack before relying on it.

version: 1
pack: vanity-tenants
description: "Vendor-hosted tenant namespaces. Detected by resolving a candidate-derived hostname and comparing it against a random-label baseline, so wildcard DNS does not produce false positives."

