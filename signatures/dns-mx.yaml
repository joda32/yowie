# Yowie signature pack — schema v1
#
# Edit freely: signatures are data, not code. Run `yowie validate`
# after changes to check the pack before relying on it.

version: 1
pack: dns-mx
description: "Mail exchangers, which identify the mail platform and any mail security gateway in front of it."

signatures:
  - id: mx-barracuda-networks
    vendor: "Barracuda"
    category: "Email Security"
    type: mx
    query: "{domain}"
    match:
      contains: "barracudanetworks.com"
    confidence: high

  - id: mx-google-mail-gmail
    vendor: "Google Mail (Gmail)"
    category: "Email"
    type: mx
    query: "{domain}"
    match:
      contains: "google.com"
    confidence: high

  - id: mx-google-mail-gmail-2
    vendor: "Google Mail (Gmail)"
    category: "Email"
    type: mx
    query: "{domain}"
