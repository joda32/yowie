# Yowie signature pack — schema v1
#
# Edit freely: signatures are data, not code. Run `yowie validate`
# after changes to check the pack before relying on it.

version: 1
pack: dns-txt
description: "Domain-ownership verification tokens published as TXT records. The highest-signal channel: these tokens are issued by the vendor to a specific domain."

signatures:
  - id: txt-1password
    vendor: "1Password"
    category: "Identity & Secrets"
    type: txt
    query: "{domain}"
    match:
      contains: "1password-site-verification"
    confidence: high

