# Yowie signature pack — schema v1
#
# Edit freely: signatures are data, not code. Run `yowie validate`
# after changes to check the pack before relying on it.

version: 1
pack: email-spf
description: "Senders authorised in the domain's SPF include graph. Matched against the fully resolved graph, so nested includes and redirects are covered."

signatures:
  - id: spf-barracuda
    vendor: "Barracuda"
    category: "Email Security"
    type: spf_include
    query: "{domain}"
    match:
      contains: "barracudanetworks.com"
    confidence: high

  - id: spf-dmarcly
    vendor: "Dmarcly"
    category: "Email Security"
    type: spf_include
    query: "{domain}"
    match:
      contains: "dmarclb.com"
    confidence: high
    notes: "Dmarcly's SPF flattening service. Includes appear as several _u/nbN subdomains of dmarclb.com."

  - id: spf-freshdesk
    vendor: "Freshdesk"
    category: "Service Desk"
    type: spf_include
    query: "{domain}"
    match:
      contains: "freshdesk.com"
    confidence: high

