  - id: spf-sage-intacct
    vendor: "Sage Intacct"
    category: "Finance & Procurement"
    type: spf_include
    query: "{domain}"
    match:
      contains: "intacct.com"
    confidence: high
    notes: "Cloud financial management and accounting. Confirmed against a live sender: _spf.intacct.com authorises the vendor's sending ranges, and intacct.com itself takes mail at intacct-com.mail.protection.outlook.com. Finance platforms are bought by finance teams, so a hit is worth confirming against the asset register."

  - id: spf-sbc-it
    vendor: "SBC IT"
    category: "Insurance & Claims"
    type: spf_include
    query: "{domain}"
