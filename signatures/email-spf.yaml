# Yowie signature pack — schema v1
#
# Edit freely: signatures are data, not code. Run `yowie validate`
# after changes to check the pack before relying on it.

version: 1
pack: email-spf
description: "Senders authorised in the domain's SPF include graph. Matched against the fully resolved graph, so nested includes and redirects are covered."

signatures:
  - id: spf-barracuda
    vendor: "Barracuda"
    category: "Email Security"
    type: spf_include
    query: "{domain}"
    match:
      contains: "barracudanetworks.com"
    confidence: high

  - id: spf-flattening-powerspf
    vendor: "Third-party SPF flattening"
    category: "Email Security"
    type: spf_include
    query: "{domain}"
    match:
      contains: "powerspf.com"
    confidence: medium
    notes: >-
      A hosted SPF service that rewrites a domain's includes, here using macro
      expansion (exists:%{i}.<tenant>.macrospf.powerspf.com) rather than
      flattened IP lists. Deliberately not attributed to a named vendor: the
      obvious candidate shares a brand prefix but sits on entirely different
      nameservers, and naming a shared platform after a guess is how two earlier
      signatures came to be wrong. Read the DMARC record to identify the
      platform actually engaged.

  - id: spf-flattening-dmarcl
    vendor: "Third-party SPF flattening"
    category: "Email Security"
    type: spf_include
    query: "{domain}"
    match:
      contains: "._spf.dmarcl"
    confidence: medium
    notes: >-
      A hosted SPF flattening service, which rewrites a domain's includes into
      generated IP lists to stay under the RFC 7208 ten-lookup limit. Includes
      appear as _u and nbN subdomains, e.g. _u.example.com._spf.dmarclh.com.
      Deliberately not attributed to a named vendor: dmarcla through dmarclj all
      resolve to one nameserver pair, and the family has been observed in use by
      more than one DMARC management platform. Read the domain's DMARC rua
      destination to identify which platform is actually engaged — that is
      reliable, this is not.

  - id: spf-google-workspace
    vendor: "Google Workspace"
    category: "Productivity"
    type: spf_include
    query: "{domain}"
    match:
      contains: "_spf.google.com"
    confidence: high

  - id: spf-google-workspace-netblocks
    vendor: "Google Workspace"
    category: "Productivity"
    type: spf_include
    query: "{domain}"
    match:
      contains: "netblocks"
    confidence: high
    notes: "Google's mail-sending netblocks, published as _netblocks.google.com, _netblocks2.google.com and so on. Matched on the bare token because the numbered variants break a full-hostname match, and because Google adds more over time. Usually reached through include:_spf.google.com, but some domains inline them directly."

