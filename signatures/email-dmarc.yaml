# Yowie signature pack — schema v1
#
# DMARC aggregate/forensic report processors. A third-party rua or ruf
# destination is a live subscription: someone is paying for that platform to
# ingest the organisation's mail authentication reports.

version: 1
pack: email-dmarc
description: "Platforms receiving this domain's DMARC aggregate and forensic reports."
defaults:
  category: "Email Security"
  confidence: high

signatures:
  - id: dmarc-agari
    vendor: "Agari"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "agari.com"

  - id: dmarc-dmarcian
    vendor: "dmarcian"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarcian.com"

  - id: dmarc-dmarcly
    vendor: "Dmarcly"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarcly.com"

  - id: dmarc-easydmarc
    vendor: "EasyDMARC"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "easydmarc."
    notes: "Matched on the bare name rather than easydmarc.com, because the vendor collects reports on several TLDs — .pro and .us were both observed in use while the .com-only match silently ignored them. The trailing dot keeps the match anchored to the label boundary."

  - id: dmarc-fraudmarc
    vendor: "Fraudmarc"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "fraudmarc.com"

  - id: dmarc-mimecast
    vendor: "Mimecast"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "mimecast.com"

  - id: dmarc-mimecast-analyzer
    vendor: "Mimecast"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarcanalyzer.com"
    notes: "DMARC Analyzer, now a Mimecast product — dmarcanalyzer.com redirects to Mimecast's product pages. Reported as Mimecast so the DMARC, SPF and MX evidence consolidate into one relationship rather than three vendors."

  - id: dmarc-mxtoolbox
    vendor: "MXToolbox"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "mxtoolbox.com"

  - id: dmarc-ondmarc
    vendor: "Red Sift OnDMARC"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "ondmarc.com"

  - id: dmarc-postmark
    vendor: "Postmark"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarc.postmarkapp.com"

  - id: dmarc-powerdmarc
    vendor: "PowerDMARC"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "powerdmarc.com"
    notes: "Reports are published to rua. and ruf. subdomains, so a single relationship otherwise reports as two unattributed senders."

  - id: dmarc-everest
    vendor: "Everest"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "everest.email"
    confidence: medium
    notes: "Email deliverability platform. DNS ownership is not confirmable (Route 53) and the domain serves no site; pairs with the everestengagement.com tracking signature."

  - id: dmarc-inbox-monster
    vendor: "Inbox Monster"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "inboxmonster.com"
    notes: "Email testing and deliverability, confirmed from the vendor's own site."

  - id: dmarc-netcraft
    vendor: "Netcraft"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "netcraft.com"
    notes: "Digital risk protection and phishing takedown. Ownership confirmed: SOA hostmaster.netcraft.com. Reports go to rua. and ruf. subdomains, so one relationship otherwise reports as two unattributed senders."

  - id: dmarc-cloudflare
    vendor: "Cloudflare"
    category: "Infrastructure"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarc-reports.cloudflare.net"
    notes: "Cloudflare's DMARC Management receives aggregate reports. Consolidates with the CDN signature so one relationship does not report as two vendors."

  - id: dmarc-mxtoolbox-report
    vendor: "MXToolbox"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarc-report.com"
    notes: "MXToolbox receives reports on dmarc-report.com, not mxtoolbox.com, so the companion signature never matched. Aggregate and forensic reports go to separate subdomains of it."

  - id: dmarc-brevo
    vendor: "Brevo"
    category: "Marketing"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarc.brevo.com"
    notes: "Brevo also processes DMARC reports. Consolidates with the brevo-code TXT signature."

  - id: dmarc-dmarcian-ap
    vendor: "dmarcian"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarcian-ap.com"
    notes: "dmarcian's Asia-Pacific instance, confirmed from the site it serves. The companion signature matches dmarcian.com only, so APAC customers were reported as unattributed."

  - id: dmarc-report-uri
    vendor: "Report URI"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "report-uri.com"
    confidence: medium
    notes: "Security reporting service covering DMARC alongside CSP and other browser reports. The site sits behind a challenge page so the brand could not be read directly."

  - id: dmarc-redsift-cloud
    vendor: "Red Sift OnDMARC"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "redsift.cloud"
    notes: "Red Sift also receives reports on redsift.cloud, confirmed from the site it serves. The companion signature matches ondmarc.com only."

  - id: dmarc-250ok
    vendor: "Validity"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "250ok.net"
    confidence: medium
    notes: "250ok, now part of Validity. The zone is on Route 53 and the domain serves no site, so this one rests on the product name — unlike the Return Path signature alongside it, whose ownership is confirmable."

  - id: dmarc-returnpath
    vendor: "Validity"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "returnpath.net"
    notes: "Return Path, now a Validity product. Ownership confirmed from the vendor's own redirect chain: returnpath.net answers 301 to returnpath.com, which answers 301 to validity.com/products/returnpath. Reports are addressed to auth.returnpath.net; matched on the bare domain to cover the other report hosts."

  - id: dmarc-proofpoint
    vendor: "Proofpoint"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "emaildefense.proofpoint.com"

  - id: dmarc-sendmarc
    vendor: "Sendmarc"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "sendmarc.com"

  - id: dmarc-uriports
    vendor: "URIports"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "uriports.com"

  - id: dmarc-valimail
    vendor: "Valimail"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "valimail.com"

  - id: dmarc-valimail-short
    vendor: "Valimail"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "vali.email"
    notes: "Valimail publishes aggregate reports to vali.email, not valimail.com. The longer form is kept as well because both appear in the wild."

  - id: dmarc-dmarc25
    vendor: "DMARC/25"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarc25.jp"
    notes: "Japanese cloud DMARC analysis service, confirmed from the site it serves at dmarc25.jp."

  - id: dmarc-customers-mail-cloud
    vendor: "Customers Mail Cloud"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "smtps.jp"
    notes: "Japanese transactional email platform. Ownership confirmed from the site at www.smtps.jp, which serves the Customers Mail Cloud product page. Reports are addressed to dp.smtps.jp; matched on the bare domain."

  - id: dmarc-mailhardener
    vendor: "Mailhardener"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "mailhardener.com"
    notes: "Email authentication monitoring service, confirmed from the site it serves. Reports are addressed to in.mailhardener.com; matched on the bare domain, which also covers the MTA-STS hosting it provides under the same name."

  # --- Added from the eighth, ninth and tenth signature-mining sweeps ------
  #
  # Ranked by the number of distinct organisations each sender appeared on.
  # Entries whose operator could not be established from DNS ship disabled,
  # with the negative result recorded in notes so it is not rediscovered.

  - id: dmarc-sendmarc-sdmarc
    vendor: "Sendmarc"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "sdmarc.net"
    notes: "Sendmarc's report-collection domain, distinct from the sendmarc.com destination the existing signature matches. Confirmed by DNS: sdmarc.net has SOA ns1.sendmarc.net. Observed as an unmatched DMARC destination on 4 organisations, with 11 further per-customer hostnames under the same suffix."

  - id: dmarc-dmarcadvisor
    vendor: "DMARC Advisor"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarcadvisor.com"
    disabled: true
    notes: "UNCONFIRMED operator. The most frequent unmatched DMARC destination in the sweep by a wide margin — 12 organisations, via ag.eu.dmarcadvisor.com and fr.eu.dmarcadvisor.com, the regional split implying a European processor. Ownership is not confirmable from DNS: the zone is on Google Cloud DNS with no organisation in the SOA. Confirm against the vendor's own site before enabling."

  - id: dmarc-cisco-dmarc-management
    vendor: "Cisco Email Security"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmp.cisco.com"
    disabled: true
    notes: "UNCONFIRMED as a distinct product. Observed as rua.dmp.cisco.com and ruf.dmp.cisco.com on 5 organisations. The domain is unambiguously Cisco's, but which product line collects these — and whether it should report as Cisco Email Security or as its own entry — has not been established. Enabling it under the wrong vendor name would split or merge findings incorrectly."

  - id: dmarc-cisa-federal
    vendor: "CISA Federal DMARC"
    category: "Compliance & GRC"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "dmarc.cyber.dhs.gov"
    disabled: true
    notes: "UNCONFIRMED framing rather than unconfirmed ownership — the domain is plainly the US Department of Homeland Security's. Observed on 8 organisations, all US federal. This is a compliance mandate (BOD 18-01) rather than a purchased SaaS subscription, so it may not belong in a shadow-IT report at all. Decide whether the tool should surface obligations as well as subscriptions before enabling."

  - id: dmarc-lovable
    vendor: "Lovable"
    category: "Development"
    type: dmarc_rua
    query: "{domain}"
    match:
      contains: "lovable.dev"
    confidence: low
    disabled: true
    notes: "UNCONFIRMED, and parked as much for its shape as its ownership. The observation is a DMARC rua destination of dmarcreports@lovable.dev on one organisation — not an SPF include, which is how this entry was first drafted and why it silently failed to fire until tested. lovable.dev is an AI application builder, and a report destination there is not a product feature it advertises; the likelier explanation is that whoever built the site pointed DMARC at their own domain. That makes it a finding about a supplier relationship rather than a SaaS subscription, and attributing it to the vendor would misdescribe it. Identify what is actually collecting these reports before enabling."
