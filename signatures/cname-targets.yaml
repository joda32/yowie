  - id: cname-target-aws-elb-regional
    vendor: "AWS Elastic Load Balancing"
    category: "Infrastructure"
    type: cname_target
    query: "elb.*.amazonaws.com"
    confidence: medium
    notes: >-
      AWS publishes load balancer hostnames in two shapes and the region sits on
      a different side of the "elb" label in each: classic and older ALB names
      end .<region>.elb.amazonaws.com, while NLB and newer names end
      .elb.<region>.amazonaws.com. The companion signature covers the first
      form; without this one the second was silently unmatched and reported as
      an unidentified host.

