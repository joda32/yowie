# Yowie signature pack — schema v1
#
# Hosting suffixes that identify a vendor when one of the organisation's own
# subdomains is aliased to it.
#
# Unlike the vanity pack, these are never queried directly. They are applied to
# hostnames discovered in Certificate Transparency logs, which is how the tool
# finds SaaS that was set up under a custom subdomain — the usual shape of a
# team quietly onboarding a product.
#
# `query` is the bare hosting suffix. Matching is on a label boundary, so
# "zendesk.com" matches "acme.zendesk.com" but never "notzendesk.com".

version: 1
pack: cname-targets
description: "Vendor hosting suffixes, matched against the CNAME targets of discovered subdomains."
defaults:
  confidence: high

signatures:
  - id: cname-target-atlassian
    vendor: "Atlassian"
    category: "Collaboration"
    type: cname_target
    query: "atlassian.net"

  - id: cname-target-aws-cloudfront
    vendor: "AWS CloudFront"
    category: "Infrastructure"
    type: cname_target
    query: "cloudfront.net"
    confidence: medium
    notes: "CDN fronting is generic; it identifies AWS but not the application behind it."

  - id: cname-target-aws-elb
    vendor: "AWS Elastic Load Balancing"
    category: "Infrastructure"
    type: cname_target
    query: "elb.amazonaws.com"
    confidence: medium

  - id: cname-target-aws-api-gateway
    vendor: "AWS API Gateway"
    category: "Infrastructure"
    type: cname_target
    query: "execute-api.*.amazonaws.com"
    confidence: medium

  - id: cname-target-azure-frontdoor
    vendor: "Azure Front Door"
    category: "Infrastructure"
    type: cname_target
    query: "azurefd.net"
    confidence: medium

  - id: cname-target-azure-cloud-services
    vendor: "Azure Cloud Services"
    category: "Infrastructure"
    type: cname_target
    query: "cloudapp.azure.com"
    confidence: medium
    notes: "Identifies Azure-hosted compute but not the application running on it. Common enough on large estates to be background noise rather than a finding."

  - id: cname-target-azure-traffic-manager
    vendor: "Azure Traffic Manager"
    category: "Infrastructure"
    type: cname_target
    query: "trafficmanager.net"
    confidence: medium
    notes: "DNS-level load balancing in front of something else; the real service is whatever the profile resolves on to."

  - id: cname-target-azure-websites
    vendor: "Azure App Service"
    category: "Infrastructure"
    type: cname_target
    query: "azurewebsites.net"

  - id: cname-target-barracuda-waas
    vendor: "Barracuda WAF-as-a-Service"
    category: "Security"
    type: cname_target
    query: "cudawaas.com"

  - id: cname-target-bigcommerce
    vendor: "BigCommerce"
    category: "eCommerce"
    type: cname_target
    query: "mybigcommerce.com"

  - id: cname-target-cloudflare
