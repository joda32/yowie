# Yowie signature pack — schema v1
#
# Hosting suffixes that identify a vendor when one of the organisation's own
# subdomains is aliased to it.
#
# Unlike the vanity pack, these are never queried directly. They are applied to
# hostnames discovered in Certificate Transparency logs, which is how the tool
# finds SaaS that was set up under a custom subdomain — the usual shape of a
# team quietly onboarding a product.
#
# `query` is the bare hosting suffix. Matching is on a label boundary, so
# "zendesk.com" matches "acme.zendesk.com" but never "notzendesk.com".

version: 1
pack: cname-targets
description: "Vendor hosting suffixes, matched against the CNAME targets of discovered subdomains."
defaults:
  confidence: high

signatures:
  - id: cname-target-acorn-lms
    vendor: "Acorn LMS"
    category: "HR & Learning"
    type: cname_target
    query: "acornlms.com"
    notes: "Australian learning and performance platform, trading as Acorn (acorn.works). Tenants are aliased as <host>.<customer-domain>.hosted.acornlms.com, so a hit names both the vendor and the customer's own subdomain."

  - id: cname-target-adobe-experience-cloud
    vendor: "Adobe Experience Cloud"
    category: "Analytics"
    type: cname_target
    query: "adobedc.net"
    notes: "Adobe's Experience Platform data collection endpoint. Ownership confirmed: adobedc.net is served by ns*.adobe.net with SOA techops-cst.adobe.com. Customers alias a first-party collection hostname here to dodge tracking protection, so a hit means behavioural analytics on the organisation's own domain."

  - id: cname-target-adobe-experience-manager
    vendor: "Adobe Experience Manager"
    category: "Content Management"
    type: cname_target
    query: "adobecqms.net"
    notes: "Adobe Managed Services for Experience Manager — cqms is CQ (the product's pre-AEM name) plus Managed Services. DNS ownership is not confirmable because the zone sits on AWS nameservers, but the naming is explicit and tenants appear as <customer>-<env>.adobecqms.net, which also exposes the environment."

  - id: cname-target-adobe-analytics
    vendor: "Adobe Analytics"
    category: "Analytics"
    type: cname_target
    query: "omtrdc.net"
    notes: "Adobe Analytics data collection, from the Omniture heritage. Ownership confirmed: SOA hostmaster.adobe.com on ns*.adobe.net. A first-party alias here means behavioural analytics collected on the organisation's own domain."

  - id: cname-target-akamai
    vendor: "Akamai"
    category: "Infrastructure"
    type: cname_target
    query: "edgekey.net"
    confidence: medium
    notes: "Akamai's edge delivery network, confirmed by SOA hostmaster.akamai.com. CDN fronting identifies the provider but not the application behind it."

  - id: cname-target-akamai-edgesuite
    vendor: "Akamai"
    category: "Infrastructure"
    type: cname_target
    query: "edgesuite.net"
    confidence: medium
    notes: "Akamai's older delivery suffix. Not observed in the sample that produced the edgekey.net entry, but the same platform."

  - id: cname-target-atlassian
    vendor: "Atlassian"
    category: "Collaboration"
    type: cname_target
    query: "atlassian.net"

  - id: cname-target-adobe-campaign
    vendor: "Adobe Campaign"
    category: "Marketing"
    type: cname_target
    query: "campaign.adobe.com"
    notes: "Adobe's marketing automation platform. Customers alias a sending subdomain here, so the hostname is usually something like communication.<domain>."

  - id: cname-target-aws-cloudfront
    vendor: "AWS CloudFront"
    category: "Infrastructure"
    type: cname_target
    query: "cloudfront.net"
    confidence: medium
    notes: "CDN fronting is generic; it identifies AWS but not the application behind it."

  - id: cname-target-aws-elb
